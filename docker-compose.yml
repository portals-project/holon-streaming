services:
  kafka:
    image: apache/kafka-native
    ports:
      - "9092:9092"
    environment:
      # Configure listeners for both docker and host communication
      KAFKA_LISTENERS: CONTROLLER://localhost:9091,HOST://0.0.0.0:9092,DOCKER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,DOCKER:PLAINTEXT,HOST:PLAINTEXT

      # Settings required for KRaft mode
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9091

      # Listener to use for broker-to-broker communication
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER

      # Required for a single node cluster
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 8080:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  init-kafka:
    image: confluentinc/cp-kafka:6.1.1
    depends_on:
      - kafka
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      # blocks until kafka is reachable
      kafka-topics --bootstrap-server kafka:9093 --list
      
      echo -e 'Creating kafka topics'
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic nexmark --replication-factor 1 --partitions 4
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic broadcast --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic control --replication-factor 1 --partitions 1
      kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic output --replication-factor 1 --partitions 1
      
      echo -e 'Successfully created the following topics:'
      kafka-topics --bootstrap-server kafka:9093 --list
      "

  nexmark-producer-0:
    build:
      context: .
      dockerfile: docker/nexmark-producer/Dockerfile
    depends_on:
      - init-kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
      PRODUCER_SLEEP_TIME_MS: "500"

  output-consumer:
    build:
      context: .
      dockerfile: docker/output-consumer/Dockerfile
    depends_on:
      - init-kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"

  holon-node-0:
    build:
      context: .
      dockerfile: docker/holon-node/Dockerfile
    depends_on:
      - init-kafka
    environment:
      NODE_ID: "0"
      RUNTIME: "300000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
      SLEEP_BETWEEN_POLLS: "0"

  holon-node-1:
    build:
      context: .
      dockerfile: docker/holon-node/Dockerfile
    depends_on:
      - init-kafka
    environment:
      NODE_ID: "1"
      RUNTIME: "300000"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9093"
      SLEEP_BETWEEN_POLLS: "100"