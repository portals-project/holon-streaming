apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: jobmanager
  name: jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: jobmanager
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: jobmanager
    spec:
{{/*      nodeSelector:*/}}
{{/*        node-type: basic*/}}
      containers:
        - command: [ "/docker-entrypoint.sh" ]
          args: [ "jobmanager" ]
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /opt/gcs/key.json
            - name: FLINK_PROPERTIES
              value: |2
                jobmanager.rpc.address: jobmanager
                state.backend: rocksdb
                state.backend.rocksdb.incremental: true
                state.backend.async: true
                state.backend.incremental: true
                execution.checkpointing.incremental: true
                taskmanager.numberOfTaskSlots: 3
                jobmanager.memory.process.size: 2048m
                taskmanager.memory.process.size: 1700m
                taskmanager.memory.task.heap.size: 1024m
                taskmanager.memory.jvm-overhead.max: 256m
                taskmanager.memory.jvm-metaspace.size: 128m
                state.checkpoints.dir: gs://flink-checkpoints-kolya-2/checkpoints
                state.savepoints.dir: gs://flink-checkpoints-kolya-2/savepoints
{{/*                execution.checkpointing.timeout: 30000*/}}
                execution.checkpointing.unaligned: true
{{/*                fs.gs.storage.http.connect-timeout-ms: 10000*/}}
{{/*                fs.gs.storage.http.read-timeout-ms: 30000*/}}
                fs.gs.storage.retry.max-retries: 5
                execution.checkpointing.interval: 5000
                execution.checkpointing.tolerable-failed-checkpoints: 5
                execution.checkpointing.max-concurrent-checkpoints: 1
                execution.checkpointing.interval-during-backlog: 0
                execution.checkpointing.min-pause: 3500
                heartbeat.interval: 4000
                heartbeat.timeout: 6000
          image: {{ $.Values.flink.image }}
          name: flink-jobmanager
          ports:
            - containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: gcs-key
              mountPath: /opt/gcs
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: gcs-key
          secret:
            secretName: gcs-key
