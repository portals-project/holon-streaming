version: '3.8'

services:
  jobmanager:
    image: flink:1.18
    container_name: flink-jobmanager
    ports:
      - "8081:8081"
    command: jobmanager
    volumes:
      - ./flink-connectors:/opt/flink/lib/user
      - ./queries:/opt/flink/queries
      - ./flink-checkpoints:/flink-checkpoints
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///flink-checkpoints/checkpoints
        state.savepoints.dir: file:///flink-checkpoints/savepoints
        state.backend: filesystem
        execution.checkpointing.interval: 5000
        execution.checkpointing.tolerable-failed-checkpoints: 5
        execution.checkpointing.max-concurrent-checkpoints: 1
        heartbeat.interval: 10000
        heartbeat.timeout: 30000

  taskmanager1:
    image: flink:1.18
    container_name: flink-taskmanager1
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - ./flink-connectors:/opt/flink/lib/user
      - ./flink-checkpoints:/flink-checkpoints
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
        state.checkpoints.dir: file:///flink-checkpoints/checkpoints
        state.savepoints.dir: file:///flink-checkpoints/savepoints
        state.backend: filesystem
        execution.checkpointing.interval: 5000
        execution.checkpointing.tolerable-failed-checkpoints: 5
        execution.checkpointing.max-concurrent-checkpoints: 1
        heartbeat.interval: 10000
        heartbeat.timeout: 30000

  taskmanager2:
    image: flink:1.18
    container_name: flink-taskmanager2
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - ./flink-connectors:/opt/flink/lib/user
      - ./flink-checkpoints:/flink-checkpoints
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 1
        state.checkpoints.dir: file:///flink-checkpoints/checkpoints
        state.savepoints.dir: file:///flink-checkpoints/savepoints
        state.backend: filesystem
        execution.checkpointing.interval: 5000
        execution.checkpointing.tolerable-failed-checkpoints: 5
        execution.checkpointing.max-concurrent-checkpoints: 1
        heartbeat.interval: 10000
        heartbeat.timeout: 30000

