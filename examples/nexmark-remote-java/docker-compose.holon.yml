# HOLON remote deployment — parameterized for the unified experiment runner.
#
# All experiment knobs come from a `.env` file in this directory (written by
# experiment/06-run.sh), with sensible defaults below so the stack also runs
# standalone. The producers/nodes/consumer all run from the same assembled fat
# JAR baked into the rubyies/*-full-deployment images.
#
# Start coordination uses the HTTP start gate (producer-start-gate). Because
# START_GATE_URL is set, holon.utils.StartGate uses HTTP and never touches
# Google Cloud / Firestore — no GCP credentials are required at runtime.

# Explicit project name so containers are named holon-experiments-* regardless
# of the remote directory name (docker compose otherwise uses the dir basename).
name: holon-experiments

x-config-settings: &config-settings
  RUN_FLINK_PRODUCER:          "${RUN_FLINK_PRODUCER:-false}"
  WORKLOAD:                    "${WORKLOAD:-7}"
  N_NODES:                     "${N_NODES:-10}"
  PARTITIONS_PER_NODE:         "${PARTITIONS_PER_NODE:-2}"
  PRODUCER_SLEEP_MS:           "${PRODUCER_SLEEP_MS:-100}"
  PRODUCER_BATCH_SIZE:         "${PRODUCER_BATCH_SIZE:-1024}"
  PRODUCER_COUNT:              "${PRODUCER_COUNT:-20}"
  EVENTS_PER_SECOND:           "${EVENTS_PER_SECOND:-10000}"
  WINDOW_LENGTH:               "${WINDOW_LENGTH:-10000}"
  GARBAGE_COLLECTION_OFFSET:   "${GARBAGE_COLLECTION_OFFSET:-10}"
  FLUSH_THRESHOLD:             "${FLUSH_THRESHOLD:-500}"
  ENABLE_RATE_LIMIT:           "${ENABLE_RATE_LIMIT:-false}"
  PROCESSING_RATE_LIMIT:       "${PROCESSING_RATE_LIMIT:-10000}"
  TOPIC_METRICS_INTERVAL:      "${TOPIC_METRICS_INTERVAL:-5000}"
  USE_LOG_FILE:                "${USE_LOG_FILE:-true}"
  RUN_MAX_THROUGHPUT_PRODUCER: "${RUN_MAX_THROUGHPUT_PRODUCER:-false}"
  KAFKA_BOOTSTRAP_SERVERS:     "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9093}"
  RUNTIME:                     "${RUNTIME:-800000}"
  SLEEP_BETWEEN_POLLS:         "${SLEEP_BETWEEN_POLLS:-0}"
  START_GATE_URL:              "${START_GATE_URL:-http://producer-start-gate:8090}"

services:

  #  KAFKA SERVICES
  # apache/kafka is the official image and is reliably pullable from Docker Hub
  # (bitnami/kafka tags have been removed). The Holon images (init-kafka, nodes,
  # producers, consumer) all connect to the in-cluster DOCKER listener on
  # kafka:9093, so that listener is preserved here; PLAINTEXT://localhost:9092
  # (host port 29092) stays for host-side access, and the controller moves to 9094.
  kafka:
    image: apache/kafka:4.0.2
    container_name: kafka
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED:            "true"
      KAFKA_CLUSTERS_0_NAME:             local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  init-kafka:
    image: rubyies/init-kafka-full-deployment:latest
    depends_on:
      - kafka
    environment:
      <<: *config-settings
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "sh /init-kafka.sh"

  # HTTP start gate (shared image with flink-remote-java). Producers POST
  # /announce on startup and block on /ready; the gate auto-flips once
  # EXPECTED_PRODUCERS have announced, so data only flows after every producer
  # (and therefore the whole stack) is up.
  producer-start-gate:
    image: rubyies/producer-start-gate-full-deployment:latest
    container_name: producer-start-gate
    environment:
      EXPECTED_PRODUCERS: "${PRODUCER_COUNT:-20}"
    ports:
      - "8090:8090"

  #  HOLON SERVICES
  holon-nodes:
    image: rubyies/holon-nodes-full-deployment:latest
    depends_on:
      - init-kafka
    environment:
      <<: *config-settings
      NUM_NODES: "${N_NODES:-10}"
    volumes:
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

  nexmark-producers:
    image: rubyies/nexmark-producers-full-deployment:latest
    depends_on:
      - init-kafka
      - producer-start-gate
    environment:
      <<: *config-settings
    volumes:
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

  output-consumer:
    image: rubyies/output-consumer-full-deployment:latest
    container_name: output-consumer
    depends_on:
      - init-kafka
      - kafka
    environment:
      <<: *config-settings
    volumes:
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

# No custom network/subnet: compose auto-creates a default bridge network and
# Docker picks a free subnet. Pinning a subnet (the old 10.200.10.0/24) only
# invites "Pool overlaps with other one on this address space" when a network
# from a previous run lingers. Services still reach each other by service name.
