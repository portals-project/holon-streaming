# HOLON remote deployment — SBT "on-the-fly" variant for the unified experiment runner.
#
# Unlike nexmark-remote-java (prebuilt assembly images), this compiles the source
# bind-mounted from the synced EC2 directory at run time, so you can edit Scala
# locally and re-run on AWS with no reassembly and no per-change image push.
#
# All services that run Holon code share the rubyies/holon-sbt image (dependency
# cache baked, no source). The one-shot `holon-build` service compiles the mounted
# source ONCE into the shared `holon-target` volume and writes target/classpath.txt;
# the run services then java-launch from that classpath (cheap fan-out), exactly
# like the assembly flow but against freshly compiled classes.
#
# Knobs come from a `.env` written by experiment/06-run.sh (defaults below let it
# run standalone). Start coordination uses the HTTP start gate (START_GATE_URL), so
# holon.utils.StartGate never touches Firestore — no GCP credentials needed.

name: holon-experiments

x-config-settings: &config-settings
  RUN_FLINK_PRODUCER:          "${RUN_FLINK_PRODUCER:-false}"
  WORKLOAD:                    "${WORKLOAD:-7}"
  N_NODES:                     "${N_NODES:-10}"
  PARTITIONS_PER_NODE:         "${PARTITIONS_PER_NODE:-2}"
  PRODUCER_SLEEP_MS:           "${PRODUCER_SLEEP_MS:-100}"
  PRODUCER_BATCH_SIZE:         "${PRODUCER_BATCH_SIZE:-1024}"
  PRODUCER_COUNT:              "${PRODUCER_COUNT:-20}"
  EVENTS_PER_SECOND:           "${EVENTS_PER_SECOND:-10000}"
  WINDOW_LENGTH:               "${WINDOW_LENGTH:-10000}"
  GARBAGE_COLLECTION_OFFSET:   "${GARBAGE_COLLECTION_OFFSET:-10}"
  FLUSH_THRESHOLD:             "${FLUSH_THRESHOLD:-500}"
  ENABLE_RATE_LIMIT:           "${ENABLE_RATE_LIMIT:-false}"
  PROCESSING_RATE_LIMIT:       "${PROCESSING_RATE_LIMIT:-10000}"
  TOPIC_METRICS_INTERVAL:      "${TOPIC_METRICS_INTERVAL:-5000}"
  USE_LOG_FILE:                "${USE_LOG_FILE:-true}"
  RUN_MAX_THROUGHPUT_PRODUCER: "${RUN_MAX_THROUGHPUT_PRODUCER:-false}"
  KAFKA_BOOTSTRAP_SERVERS:     "${KAFKA_BOOTSTRAP_SERVERS:-kafka:9093}"
  RUNTIME:                     "${RUNTIME:-800000}"
  SLEEP_BETWEEN_POLLS:         "${SLEEP_BETWEEN_POLLS:-0}"
  START_GATE_URL:              "${START_GATE_URL:-http://producer-start-gate:8090}"

# Shared base for every service that runs sbt/java against the mounted source.
x-holon-sbt: &holon-sbt
  image: rubyies/holon-sbt:latest
  working_dir: /app
  volumes:
    # On-the-fly source (synced to the EC2 box, bind-mounted here).
    - ./src:/app/src:ro
    - ./build.sbt:/app/build.sbt:ro
    - ./project:/app/project          # rw: sbt writes project/target during the meta-build
    # Shared compiled output + dependency caches (named volumes; caches seed from
    # the image's baked `sbt update` on first creation, so no re-download).
    - holon-target:/app/target
    - holon-coursier:/root/.cache
    - holon-ivy:/root/.ivy2
    - holon-sbt-home:/root/.sbt
    # Experiment outputs.
    - ./holon-logs:/app/logs
    - ./holon-snapshots:/app/snapshots

services:

  #  KAFKA SERVICES — apache/kafka is the official, reliably-pullable image
  #  (bitnami tags were removed). In-cluster listener is DOCKER://kafka:9093.
  kafka:
    image: apache/kafka:4.0.2
    container_name: kafka
    ports:
      - "29092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:9093,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED:            "true"
      KAFKA_CLUSTERS_0_NAME:             local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      - kafka

  # No custom image: run the topic-init script in the apache/kafka image itself
  # (it ships the kafka-topics.sh CLI), with the script bind-mounted.
  init-kafka:
    image: apache/kafka:4.0.2
    depends_on:
      - kafka
    environment:
      <<: *config-settings
    volumes:
      - ./docker/init-kafka.sh:/init-kafka.sh:ro
    entrypoint:
      - "/bin/sh"
      - "-c"
      - "sh /init-kafka.sh"

  # HTTP start gate (shared image with flink-remote-java). Producers POST /announce
  # on startup and block on /ready; the gate auto-flips once EXPECTED_PRODUCERS have
  # announced, so data only flows after the whole stack is up.
  producer-start-gate:
    image: rubyies/producer-start-gate-full-deployment:latest
    container_name: producer-start-gate
    environment:
      EXPECTED_PRODUCERS: "${PRODUCER_COUNT:-20}"
    ports:
      - "8090:8090"

  # One-shot: compile the mounted source ONCE into the shared target volume and
  # write target/classpath.txt. Run services wait for this to complete.
  holon-build:
    <<: *holon-sbt
    environment:
      <<: *config-settings
    depends_on:
      - init-kafka
    command: ["/bin/bash", "/app/docker/holon-build/build.sh"]
    volumes:
      - ./src:/app/src:ro
      - ./build.sbt:/app/build.sbt:ro
      - ./project:/app/project
      - ./docker:/app/docker:ro
      - holon-target:/app/target
      - holon-coursier:/root/.cache
      - holon-ivy:/root/.ivy2
      - holon-sbt-home:/root/.sbt
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

  #  HOLON SERVICES — java-launch from the compiled classpath after holon-build.
  holon-nodes:
    <<: *holon-sbt
    depends_on:
      holon-build:
        condition: service_completed_successfully
    environment:
      <<: *config-settings
      NUM_NODES: "${N_NODES:-10}"
    command: ["/bin/bash", "/app/docker/holon-node/start-nodes.sh"]
    volumes:
      - ./src:/app/src:ro
      - ./build.sbt:/app/build.sbt:ro
      - ./project:/app/project
      - ./docker:/app/docker:ro
      - holon-target:/app/target
      - holon-coursier:/root/.cache
      - holon-ivy:/root/.ivy2
      - holon-sbt-home:/root/.sbt
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

  nexmark-producers:
    <<: *holon-sbt
    depends_on:
      holon-build:
        condition: service_completed_successfully
      producer-start-gate:
        condition: service_started
    environment:
      <<: *config-settings
    command: ["/bin/bash", "/app/docker/nexmark-producer/start-producers.sh"]
    volumes:
      - ./src:/app/src:ro
      - ./build.sbt:/app/build.sbt:ro
      - ./project:/app/project
      - ./docker:/app/docker:ro
      - holon-target:/app/target
      - holon-coursier:/root/.cache
      - holon-ivy:/root/.ivy2
      - holon-sbt-home:/root/.sbt
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

  output-consumer:
    <<: *holon-sbt
    container_name: output-consumer
    depends_on:
      holon-build:
        condition: service_completed_successfully
    environment:
      <<: *config-settings
    command: ["/bin/bash", "/app/docker/output-consumer/start-consumer.sh"]
    volumes:
      - ./src:/app/src:ro
      - ./build.sbt:/app/build.sbt:ro
      - ./project:/app/project
      - ./docker:/app/docker:ro
      - holon-target:/app/target
      - holon-coursier:/root/.cache
      - holon-ivy:/root/.ivy2
      - holon-sbt-home:/root/.sbt
      - ./holon-logs:/app/logs
      - ./holon-snapshots:/app/snapshots

volumes:
  holon-target:
  holon-coursier:
  holon-ivy:
  holon-sbt-home:
