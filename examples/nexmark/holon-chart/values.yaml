holon:
  image: gcr.io/holon-458408/holon-node-ruben:latest
  n_nodes: 10
  partitions_per_node: 2
  runtime: 900000
  sleep_between_polls: 0
  replicas: 1
  # Set resource limits for GKE
  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

nexmarkProducer:
  image: gcr.io/holon-458408/nexmark-producer-ruben:latest
  replicas: 1
  sleepTimeMs: 100

outputConsumer:
  image: gcr.io/holon-458408/output-consumer-ruben:latest
  replicas: 1