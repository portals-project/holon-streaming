---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-kafka
spec:
  backoffLimit: 4  # number of retries before failing permanently
  template:
    metadata:
      labels:
        job: init-kafka
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init-kafka
          image: confluentinc/cp-kafka:6.1.1
          command:
            - /bin/sh
            - -c
            - sh /init-kafka.sh
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: N_NODES
              value: "3"
            - name: PARTITIONS_PER_NODE
              value: "2"
          volumeMounts:
            - mountPath: /init-kafka.sh
              name: init-kafka-cm0
              subPath: init-kafka.sh
      volumes:
        - name: init-kafka-cm0
          configMap:
            name: init-kafka-cm0
            items:
              - key: init-kafka.sh
                path: init-kafka.sh

---
apiVersion: v1
data:
  init-kafka.sh: |-
    #!/bin/sh

    # wait until Kafka is reachable
    until kafka-topics --bootstrap-server kafka:9093 --list > /dev/null 2>&1; do
      echo "Waiting for Kafka to be available..."
      sleep 1
    done

    echo "N_NODES: $N_NODES"
    echo "PARTITIONS_PER_NODE: $PARTITIONS_PER_NODE"
    TOTAL_PARTITIONS=$((N_NODES * PARTITIONS_PER_NODE))
    echo "TOTAL_PARTITIONS: $TOTAL_PARTITIONS"

    kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic input --replication-factor 1 --partitions $TOTAL_PARTITIONS
    kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic broadcast --replication-factor 1 --partitions 1
    kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic control --replication-factor 1 --partitions 1
    kafka-topics --bootstrap-server kafka:9093 --create --if-not-exists --topic output --replication-factor 1 --partitions 1

    echo "Successfully created topics:"
    kafka-topics --bootstrap-server kafka:9093 --list
kind: ConfigMap
metadata:
  annotations:
    use-subpath: "true"
  labels:
    io.kompose.service: init-kafka
  name: init-kafka-cm0

---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yml --stdout
    kompose.version: 1.35.0 (HEAD)
  labels:
    io.kompose.service: kafka
  name: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: kafka
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yml --stdout
        kompose.version: 1.35.0 (HEAD)
      labels:
        io.kompose.service: kafka
    spec:
      containers:
        - env:
            - name: KAFKA_CFG_ADVERTISED_LISTENERS
              value: BROKER://kafka:9092,DOCKER://kafka:9093
            - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9091
            - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
              value: DOCKER
            - name: KAFKA_CFG_LISTENERS
              value: CONTROLLER://:9091,BROKER://0.0.0.0:9092,DOCKER://0.0.0.0:9093
            - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,BROKER:PLAINTEXT,DOCKER:PLAINTEXT
            - name: KAFKA_CFG_NODE_ID
              value: "1"
            - name: KAFKA_CFG_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_KRAFT_CLUSTER_ID
              value: kraft-cluster-id
          image: bitnami/kafka:3.7.0
          name: kafka
          ports:
            - containerPort: 9092
              protocol: TCP
      restartPolicy: Always

