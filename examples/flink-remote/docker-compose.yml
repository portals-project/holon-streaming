version: '3.8'

services:

  jobmanager:
    image: flink:1.18
    container_name: flink-jobmanager
    user: root
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    volumes:
      - /home/jonas_spenger/projects/holon/flink-experiments/flink-connectors:/opt/flink/lib/user
      - /home/jonas_spenger/projects/holon/flink-experiments/queries:/opt/flink/queries
      - /home/jonas_spenger/projects/holon/flink-experiments/flink-checkpoints:/flink-checkpoints
      - /home/jonas_spenger/projects/holon/flink-experiments/flink-logs:/opt/flink/log
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        state.checkpoints.dir: file:///flink-checkpoints/checkpoints
        state.savepoints.dir:  file:///flink-checkpoints/savepoints
        state.backend:         filesystem
        execution.checkpointing.interval:      5000
        execution.checkpointing.tolerable-failed-checkpoints: 5
        execution.checkpointing.max-concurrent-checkpoints:   1
        heartbeat.interval:       10000
        heartbeat.timeout:        30000

  taskmanager1:
    image: flink:1.18
    container_name: flink-taskmanager1
    depends_on:
      - jobmanager
    command: taskmanager
    volumes:
      - /home/jonas_spenger/projects/holon/flink-experiments/flink-connectors:/opt/flink/lib/user
      - /home/jonas_spenger/projects/holon/flink-experiments/flink-checkpoints:/flink-checkpoints
      - /home/jonas_spenger/projects/holon/flink-experiments/flink-logs:/opt/flink/log
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.checkpoints.dir: file:///flink-checkpoints/checkpoints
        state.savepoints.dir:  file:///flink-checkpoints/savepoints
        state.backend:         filesystem
        execution.checkpointing.interval:      5000
        execution.checkpointing.tolerable-failed-checkpoints: 5
        execution.checkpointing.max-concurrent-checkpoints:   1
        heartbeat.interval:       10000
        heartbeat.timeout:        30000

